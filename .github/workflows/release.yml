# This workflow will create a new release when a version tag is pushed
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Create Release

on:
  push:
    tags:
      - 'v*' # Run when tag matches v*, e.g., v1.0.0

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  create-release:
    needs: build-and-test
    runs-on: macos-latest
    permissions:
      contents: write # Needed for creating releases
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up signing certificate
      env:
        MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        # Turn our base64-encoded certificate back to a regular .p12 file
        echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
        
        # Create a new keychain
        security create-keychain -p "temporary-password" build.keychain 
        security default-keychain -s build.keychain
        security unlock-keychain -p "temporary-password" build.keychain
        security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporary-password" build.keychain
    
    - name: Build application
      run: |
        swift build -c release
        
        # Create application bundle
        APP_DIR="WNBASchedule.app"
        CONTENTS_DIR="$APP_DIR/Contents"
        MACOS_DIR="$CONTENTS_DIR/MacOS"
        RESOURCES_DIR="$CONTENTS_DIR/Resources"
        
        # Create directory structure
        mkdir -p "$MACOS_DIR"
        mkdir -p "$RESOURCES_DIR"
        
        # Copy executable
        cp .build/release/WNBASchedule "$MACOS_DIR/"
        
        # Copy Info.plist
        cp Info/Info.plist "$CONTENTS_DIR/"
        
        # Copy resources
        cp Sources/WNBASchedule/Resources/basketball-icon.txt "$RESOURCES_DIR/"
    
    - name: Code sign the app
      env:
        MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      run: |
        # Sign with hardened runtime
        /usr/bin/codesign --force --options runtime --sign "$MACOS_CODESIGN_IDENTITY" "WNBASchedule.app" --deep
    
    - name: Notarize the app
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        # Create keychain profile for notarization
        xcrun notarytool store-credentials "notarytool-profile" \
          --apple-id "$APPLE_ID" \
          --team-id "$MACOS_API_ISSUER_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD"
        
        # Create a zip for notarization
        ditto -c -k --keepParent "WNBASchedule.app" "notarization.zip"
        
        # Submit for notarization and wait for the result
        xcrun notarytool submit "notarization.zip" --keychain-profile "notarytool-profile" --wait
        
        # Staple the ticket to the app
        xcrun stapler staple "WNBASchedule.app" || echo "Stapling failed, but continuing..."
    
    - name: Create final ZIP archive
      run: |
        # Use ditto to preserve file attributes and permissions
        ditto -c -k --keepParent WNBASchedule.app WNBASchedule.zip
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          WNBASchedule.zip
        body: |
          # WNBASchedule ${{ steps.get_version.outputs.VERSION }}
          
          A native Swift menu bar application that displays WNBA schedule information for the New York Liberty team.
          
          ## Installation
          
          1. Download the WNBASchedule.zip file
          2. Unzip the file
          3. Move WNBASchedule.app to your Applications folder
          4. Open the application