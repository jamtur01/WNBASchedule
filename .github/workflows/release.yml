# This workflow will create a new release when a version tag is pushed
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Create Release

on:
  push:
    tags:
      - 'v*' # Run when tag matches v*, e.g., v1.0.0

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  create-release:
    needs: build-and-test
    runs-on: macos-latest
    permissions:
      contents: write # Needed for creating releases
    steps:
    - uses: actions/checkout@v4
    
    - name: Create application bundle
      run: |
        chmod +x ./build.sh
        ./build.sh
    
    - name: Create ZIP archive
      run: |
        zip -r WNBASchedule.zip WNBASchedule.app
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          WNBASchedule.zip
        body: |
          # WNBASchedule ${{ steps.get_version.outputs.VERSION }}
          
          A native Swift menu bar application that displays WNBA schedule information for the New York Liberty team.
          
          ## Installation
          
          1. Download the WNBASchedule.zip file
          2. Unzip the file
          3. Move WNBASchedule.app to your Applications folder
          4. Open the application