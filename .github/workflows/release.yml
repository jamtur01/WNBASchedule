name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  create-release:
    needs: build-and-test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "temporary-password" build.keychain 
          security default-keychain -s build.keychain
          security unlock-keychain -p "temporary-password" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporary-password" build.keychain

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64
          swift build -c release --arch x86_64

          mkdir -p .build/universal
          lipo -create \
            .build/arm64-apple-macosx/release/WNBASchedule \
            .build/x86_64-apple-macosx/release/WNBASchedule \
            -output .build/universal/WNBASchedule

          lipo -info .build/universal/WNBASchedule

      - name: Build application bundle
        run: |
          APP_DIR="WNBASchedule.app"
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"

          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"

          cp .build/universal/WNBASchedule "$MACOS_DIR/"
          cp Info/Info.plist "$CONTENTS_DIR/"
          cp Sources/WNBASchedule/Resources/basketball-icon.txt "$RESOURCES_DIR/"

      - name: Code sign the app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          /usr/bin/codesign --force --options runtime --sign "$MACOS_CODESIGN_IDENTITY" WNBASchedule.app --deep

      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$MACOS_API_ISSUER_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          ditto -c -k --keepParent WNBASchedule.app notarization.zip

          xcrun notarytool submit notarization.zip --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple WNBASchedule.app || echo "Stapling failed, but continuing..."

      - name: Create final ZIP archive
        run: |
          ditto -c -k --keepParent WNBASchedule.app WNBASchedule.zip

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            WNBASchedule.zip
          body: |
            # WNBASchedule ${{ steps.get_version.outputs.VERSION }}

            A native Swift menu bar application that displays WNBA schedule information for the New York Liberty team.

            ## Installation

            1. Download the WNBASchedule.zip file  
            2. Unzip the file  
            3. Move WNBASchedule.app to your Applications folder  
            4. Open the application
